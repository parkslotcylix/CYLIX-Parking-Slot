<!-- Navbar JavaScript for Active Link Management -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Set active navigation link based on current page
  setActiveNavLink();
  
  // Hide Admin Management link if not super_admin
  hideAdminManagementIfNotSuperAdmin();
});

function setActiveNavLink() {
  const currentPath = window.location.pathname;
  const navLinks = document.querySelectorAll('.nav-link, .mobile-nav-link');
  
  // Remove all active classes first
  navLinks.forEach(link => link.classList.remove('active'));
  
  // Determine current page based on path
  let currentPage = '';
  if (currentPath === '/home' || currentPath === '/') {
    currentPage = 'home';
  } else if (currentPath === '/analytics') {
    currentPage = 'analytics';
  } else if (currentPath === '/parking') {
    currentPage = 'parking';
  } else if (currentPath === '/admin-management') {
    currentPage = 'admin-management';
  } else if (currentPath === '/account') {
    // Account page doesn't have a nav link, so no active state needed
    return;
  }
  
  // Set active class on matching links
  if (currentPage) {
    const matchingLinks = document.querySelectorAll(`[data-page="${currentPage}"]`);
    matchingLinks.forEach(link => link.classList.add('active'));
  }
}

function hideAdminManagementIfNotSuperAdmin() {
  const accessLevel = sessionStorage.getItem('access_level');
  if (accessLevel !== 'super_admin') {
    const adminLinks = document.querySelectorAll('#adminManagementLink, #mobileAdminManagementLink');
    adminLinks.forEach(link => {
      const listItem = link.closest('li');
      if (listItem) {
        listItem.style.display = 'none';
      }
    });
  }
}

// Global logout function
async function handleLogout(event) {
  event.preventDefault();
  
  if (confirm('Are you sure you want to logout?')) {
    try {
      // Call backend logout endpoint
      await fetch('/api/logout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include'
      });
    } catch (error) {
      console.error('Logout error:', error);
    }
    
    // Clear all client-side storage
    sessionStorage.clear();
    localStorage.clear();
    
    // Redirect to login
    window.location.href = '/';
  }
}

// Initialize navbar functionality when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
  // Initialize mobile navbar if the functions exist

  if (typeof initializeProfileDropdown === 'function') {

});
</script>
